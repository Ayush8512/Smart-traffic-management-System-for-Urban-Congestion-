<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Gemini Chatbot (Vanilla JS)</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #d1d5db; /* gray-300 */
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f3f4f6; /* gray-100 */
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen p-4 md:p-8 flex items-center justify-center">
        <div class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl p-6 flex flex-col h-[80vh]">

            <header class="mb-4 pb-4 border-b border-gray-200">
                <!-- Title ab JavaScript se update hoga -->
                <h1 id="main-title" class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">
                    Mini-Gemini Assistant
                </h1>
                <p class="text-sm text-gray-500 mt-1">
                    **System Instruction Active:** Main sirf **ek mukhya vaakya aur ek mazedar tathya** mein jawab doonga, kabhi bhi do se zyada vaakya nahi. Mujhse kuch bhi poocho!
                </p>
            </header>

            <!-- Message Display Area -->
            <div id="messages-container" class="flex-grow overflow-y-auto mb-6 pr-2 custom-scrollbar flex flex-col space-y-4">
                <div id="initial-message" class="text-center py-12 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                    </svg>
                    Baat-cheet shuru karein aur dekhein mera concise roop.
                </div>
            </div>

            <!-- Input Area -->
            <div class="flex space-x-3">
                <input
                    type="text"
                    id="input-field"
                    placeholder="Mini-Gemini se ek sawal poocho..."
                    class="flex-grow p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out"
                />
                <button
                    id="send-button"
                    class="px-6 py-3 rounded-xl text-white font-semibold transition duration-150 ease-in-out shadow-lg bg-blue-600 hover:bg-blue-700 active:bg-blue-800"
                >
                    Bhejo
                </button>
            </div>

        </div>
    </div>

    <script>
        // --- Configuration ---
        const USER_NAME = 'Ayush'; // <--- Naam ab 'Ayush' hai!
        // ---------------------

        const messagesContainer = document.getElementById('messages-container');
        const inputField = document.getElementById('input-field');
        const sendButton = document.getElementById('send-button');
        const initialMessage = document.getElementById('initial-message');
        const mainTitle = document.getElementById('main-title');

        let isLoading = false;

        /**
         * Utility function for exponential backoff during API calls.
         */
        async function withRetry(fn, args, retries = 5) {
            for (let i = 0; i < retries; i++) {
                try {
                    return await fn(...args);
                } catch (error) {
                    // Log the error before retry attempt
                    if (i < retries - 1) {
                        console.warn(`Retry attempt ${i + 1} failed. Retrying...`, error);
                    }
                    if (i === retries - 1) throw error;
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        /**
         * Creates a chat bubble DOM element.
         */
        function createMessageBubble(sender, text, sources = []) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex mb-4 ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-xs md:max-w-md lg:max-w-lg p-3 rounded-xl shadow-lg transition-all duration-300 ${
                sender === 'user'
                    ? 'bg-blue-600 text-white rounded-br-none'
                    : 'bg-gray-100 text-gray-800 rounded-tl-none border border-gray-200'
            }`;

            const textPara = document.createElement('p');
            textPara.className = 'whitespace-pre-wrap text-sm md:text-base';
            textPara.textContent = text;
            bubble.appendChild(textPara);

            if (sources.length > 0) {
                const sourceDiv = document.createElement('div');
                sourceDiv.className = 'mt-2 pt-2 border-t border-gray-300 text-xs text-gray-500'; 

                const title = document.createElement('p');
                title.className = 'font-semibold';
                title.textContent = 'Sources:';
                sourceDiv.appendChild(title);

                sources.slice(0, 2).forEach(source => {
                    const link = document.createElement('a');
                    link.href = source.uri;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.className = 'block truncate hover:text-blue-500 transition-colors';
                    link.title = source.title;
                    link.textContent = source.title;
                    sourceDiv.appendChild(link);
                });
                bubble.appendChild(sourceDiv);
            }

            wrapper.appendChild(bubble);
            messagesContainer.appendChild(wrapper);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function createLoadingIndicator() {
            const wrapper = document.createElement('div');
            wrapper.id = 'loading-indicator';
            wrapper.className = 'flex justify-start mb-4';

            const indicator = document.createElement('div');
            indicator.className = 'bg-gray-200 text-gray-700 p-3 rounded-xl rounded-tl-none border border-gray-300';
            indicator.innerHTML = `
                <div class="flex items-center space-x-1">
                    <div class="w-2 h-2 bg-gray-500 rounded-full animate-pulse"></div>
                    <div class="w-2 h-2 bg-gray-500 rounded-full animate-pulse delay-75"></div>
                    <div class="w-2 h-2 bg-gray-500 rounded-full animate-pulse delay-150"></div>
                </div>
            `;
            wrapper.appendChild(indicator);
            messagesContainer.appendChild(wrapper);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeLoadingIndicator() {
            const indicator = document.getElementById('loading-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function setUIState(loading) {
            isLoading = loading;
            inputField.disabled = loading;
            sendButton.disabled = loading || !inputField.value.trim();
            sendButton.textContent = loading ? 'Bhej raha...' : 'Bhejo';
            sendButton.classList.toggle('bg-gray-400', loading || !inputField.value.trim());
            sendButton.classList.toggle('hover:bg-blue-700', !loading && inputField.value.trim());
            sendButton.classList.toggle('active:bg-blue-800', !loading && inputField.value.trim());
            sendButton.classList.toggle('cursor-not-allowed', loading || !inputField.value.trim());
        }

        /**
         * Makes the Gemini API call with a focused system instruction.
         */
        async function callGeminiAPI(prompt) {
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

            // The System Instruction defines the "smaller, focused version" persona.
            const systemPrompt = "You are 'Mini-Gemini', a helpful, extremely concise, and slightly witty summarization assistant. Your responses must ONLY contain one main sentence that answers the user's query and one follow-up sentence with a related fun fact. You must never exceed two sentences total.";

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                model: "gemini-2.5-flash-preview-05-20",
                tools: [{ "google_search": {} }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            // Check for non-OK HTTP status before parsing JSON
            if (!response.ok) {
                const errorBody = await response.text();
                // Throw an error that the withRetry function can catch
                throw new Error(`API returned status ${response.status}: ${errorBody}`);
            }

            const result = await response.json();
            
            // Console log for successful API call (for debugging)
            console.log('Gemini API call successful, response:', result);

            const candidate = result.candidates?.[0];

            if (candidate && candidate.content?.parts?.[0]?.text) {
                const text = candidate.content.parts[0].text;
                let sources = [];
                const groundingMetadata = candidate.groundingMetadata;
                if (groundingMetadata && groundingMetadata.groundingAttributions) {
                    sources = groundingMetadata.groundingAttributions
                        .map(attribution => ({
                            uri: attribution.web?.uri,
                            title: attribution.web?.title,
                        }))
                        .filter(source => source.uri && source.title);
                }
                return { text, sources };
            } else {
                let errorMessage = "Maaf karna, Mini-Gemini abhi dhyan nahi de paa raha. Koi doosra sawal try karein!";
                
                // Detailed logging for blocked content
                console.error("API Error or blocked response, no text content found:", result);

                if (candidate && candidate.finishReason) {
                    const reason = candidate.finishReason;
                    console.error("Finish Reason:", reason);
                    
                    // Detailed user-facing error messages based on the reason
                    if (reason === 'SAFETY') {
                        errorMessage = "Mini-Gemini ka jawab content policy (suraksha niyam) ke kaaran rok diya gaya hai. Kripya naya sawal poochhe.";
                    } else if (reason === 'RECITATION') {
                        errorMessage = "Yeh sawal ek copyrighted ya sensitive jankari maang raha tha, isliye jawab rok diya gaya hai.";
                    } else if (reason === 'MAX_TOKENS') {
                        errorMessage = "Mini-Gemini ka concise jawab bhi bahut lamba ho gaya tha, isliye woh poora nahi ho paya. Kripya chhota sawal poochhe.";
                    } else {
                         errorMessage = `Ek anjaani samasya hui (Reason: ${reason}). Kripya phir se prayas karein.`;
                    }
                }
                
                return { text: errorMessage, sources: [] };
            }
        }

        async function sendMessage() {
            const userMessage = inputField.value.trim();
            if (!userMessage) return;

            // Remove initial message if present
            if (initialMessage) {
                initialMessage.style.display = 'none';
            }

            // 1. Add user message
            createMessageBubble('user', userMessage);
            inputField.value = '';
            setUIState(true);
            createLoadingIndicator();

            try {
                // 2. Call the constrained Mini-Gemini API
                const response = await withRetry(callGeminiAPI, [userMessage]);

                // 3. Add Mini-Gemini's response
                removeLoadingIndicator();
                createMessageBubble('bot', response.text, response.sources);

            } catch (error) {
                console.error("Failed to fetch from Gemini API after all retries:", error);
                removeLoadingIndicator();
                // Fallback message is shown after all retries fail
                createMessageBubble('bot', "Connection failed after multiple attempts. Kripya apna network check karein aur phir se try karein.", []);
            } finally {
                setUIState(false);
            }
        }

        // --- Event Listeners ---
        sendButton.addEventListener('click', sendMessage);

        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !isLoading) {
                sendMessage();
            }
        });

        // Update button state based on input field
        inputField.addEventListener('input', () => {
            setUIState(isLoading); // Re-run setUIState to update button enablement
        });
        
        // Initial state update
        window.onload = () => {
             setUIState(false);
             // Update the display name in the title
             if (mainTitle) {
                mainTitle.textContent = `${USER_NAME} ka Mini-Gemini Assistant`;
             }
             // Console log for script initialization (for debugging)
             console.log('Chatbot script initialized for Ayush.');
        };

    </script>
</body>
</html>
